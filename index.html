<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Nine to Wonderland</title>
<link rel="icon" href="./favicon.ico" />
<style>
  @font-face { font-family: 'Podkova'; font-style: normal; font-weight: 400 700; font-display: block; src: url(./assets/fonts/podkova-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Podkova'; font-style: normal; font-weight: 400 700; font-display: block; src: url(./assets/fonts/podkova-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Podkova'; font-style: normal; font-weight: 400 700; font-display: block; src: url(./assets/fonts/podkova-cyrillic.woff2) format('woff2'); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  html, body { margin: 0; padding: 0; background: #0e0f13; overflow: hidden; }
  /* 100dvh, not 100vh: on mobile 100vh is the URL-bar-HIDDEN height, so the canvas is taller than what
     you can actually see and the bottom row of UI (Settings) sits under the address bar, unreachable
     (body is overflow:hidden, so you cannot scroll to it). dvh tracks the VISIBLE viewport and fires a
     resize as the bar shows/hides, which Scale.FIT re-fits to. 100vh stays as the fallback for old UAs. */
  #game { width: 100vw; height: 100vh; height: 100dvh; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="game"></div>
<script src="./phaser.min.js"></script>
<script type="module" src="./bundle.js"></script>

</body>
</html>
